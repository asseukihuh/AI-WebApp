<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2i-LLM - Image Generation</title>
    <link rel="stylesheet" href="imageGen.css">
    <script defer src="imageGen.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Image Generation (Experimental)</h1>
            <p class="warning-banner">
                Select your parameters and enter a prompt to generate or describe an image.
            </p>
            <div class="controls-bar">
                <form id="model-form" class="control-form" onsubmit="return false;">
                    <label for="model">Model:</label>
                    <select name="model" id="model">
                        <option value="mistral:7b">mistral:7b</option>
                        <option value="deepseek-r1:7b">deepseek-r1:7b</option>
                        <option value="starling-lm:7b">starling-lm:7b</option>
                    </select>
                </form>
                <form id="size-form" class="control-form" onsubmit="return false;">
                    <label for="size">Size:</label>
                    <select name="size" id="size">
                        <option value="500px">500px</option>
                        <option value="750px">750px</option>
                        <option value="1000px">1000px</option>
                    </select>
                </form>
                <div class="nav-links">
                    <a href="chatbot.html" class="nav-link">&larr; Back to Chat</a>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="prompt-section">
                <h2>Prompt:</h2>
                <form id="prompt-form" class="prompt-form" onsubmit="return false;">
                    <textarea
                        id="prompt-input"
                        class="prompt-input"
                        placeholder="Explain clearly what you want to generate..."
                        rows="3"
                    ></textarea>
                    <button id="generate-btn" class="generate-btn" type="submit">Generate</button>
                </form>
            </section>

            <section class="result-section">
                <div id="image-container" class="image-container">
                    <div id="image-placeholder" class="image-placeholder">Image preview will appear here</div>
                    <div id="status-message" class="status-message"></div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
