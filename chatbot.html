<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2i-LLM - AI Chatbot</title>
    <link rel="stylesheet" href="src/css/chatbot.css">
    <script defer src="src/js/chatbot.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>2i-LLM</h1>
            <p class="warning-banner">
                Switching models during a conversation is not recommended. Prefer to refresh the page to start a new conversation.
            </p>
            <div class="controls-bar">
                <form id="model-form" class="model-form" onsubmit="return false;">
                    <label for="model">Select model:</label>
                    <select name="model" id="model">
                        <option value="mistral:7b">mistral:7b</option>
                        <option value="deepseek-r1:7b">deepseek-r1:7b</option>
                        <option value="starling-lm:7b">starling-lm:7b</option>
                    </select>
                </form>
                <div class="nav-links">
                    <a href="imageGen.html" class="nav-link">Image Generation &rarr;</a>
                </div>
            </div>
        </header>

        <main class="chat-section">
            <div class="chat-display-container">
                <div id="chat-messages" class="chat-messages">
                    <div id="messages-inner"></div>
                    <div id="bottom-anchor"></div>
                </div>
                <button id="go-bottom-btn" class="go-bottom-btn" type="button" title="Scroll to bottom" aria-label="Scroll to bottom">&darr;</button>
            </div>

            <form id="message-form" class="message-input-form" onsubmit="return false;">
                <textarea
                    id="user-input"
                    class="user-input"
                    placeholder="Type your message here... (Press Enter to send, Shift+Enter for newline)"
                    rows="2"
                ></textarea>
                <button id="send-btn" class="send-btn" type="submit" aria-label="Send message">Send</button>
            </form>
        </main>
    </div>
</body>
</html>
